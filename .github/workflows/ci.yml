name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  SKIP_POSTINSTALL_BUILD: "1"

jobs:
  build-and-web-tests:
    name: Build and Web Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript workspaces
        run: npm run build

      - name: Run package unit tests
        run: npm run test:packages

      - name: Run isolated pi-ai Model Gateway evaluation
        working-directory: evaluations/pi-ai-gateway
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test -- --maxWorkers=1 --minWorkers=1
          npm run test:cold-repeat

      - name: Run Web tests
        run: npm run test:web

      - name: Build Web application
        run: npm run build:web

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on lint errors only; warnings are listed in the log but do not fail the job.
      - name: Run ESLint
        run: npm run lint

  api-tests:
    name: API Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript workspaces
        run: npm run build

      # Every test file under apps/api/src, split across the matrix by vitest.
      - name: Run API test suite
        run: npm --workspace @datafoundry/api test -- --shard=${{ matrix.shard }}/4

  energyiq-seams:
    name: EnergyIQ Test Seams
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript workspaces
        run: npm run build

      # The three high-level Seams from docs/agents/energyiq-execution-baseline.md
      # (Project Analysis Resolver, Project Renderer Registry, Energy Analyst).
      - name: Run EnergyIQ high-level test Seams
        run: npm run test:energyiq:seams

  core-smoke-tests:
    name: Core Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript workspaces
        run: npm run build

      - name: Generate built-in demo fixture
        env:
          SKIP_DTC_GROWTH_REGISTER: "1"
        run: node scripts/seed-dtc-growth-demo.mjs

      - name: Run EnergyIQ backup and Release Artifact regressions
        run: npm run test:energyiq:backup

      - name: Run authentication regression
        run: node scripts/smoke-auth.mjs

      - name: Run conversation memory regression
        run: node scripts/smoke-conversation-memory.mjs

      - name: Run configuration API regression
        run: node scripts/smoke-config-api.mjs

      - name: Run EnergyIQ AI Operations contract regressions
        run: >-
          npx vitest run
          apps/api/src/energy/project-ai-operations.test.ts
          apps/api/src/authenticated-energy-get-zero-write.test.ts
          apps/api/src/energy/energy-api.saved-analysis.test.ts

      - name: Run governed Skill actual-load regressions
        run: >-
          npx vitest run
          apps/api/src/data-analysis-actual-load-vertical.test.ts
          apps/api/src/run-agent-assembly.test.ts
          apps/api/src/run-config-audit.test.ts
          apps/api/src/run-config-resolver.test.ts
          apps/api/src/skill-upload-scope.test.ts

      - name: Run governed Skill server persistence seam
        run: >-
          npx vitest run
          apps/api/src/server.energy-run-preparation.test.ts
          --testNamePattern="persists the real selected builtin Skill reader output|keeps an ordinary Energy run Skill-free"

      - name: Run Current Overview minimum contract regression
        run: >-
          npx vitest run
          apps/api/src/energy/energy-api.overview-minimum.test.ts
          apps/api/src/energy/energy-overview-headline-projection.test.ts

      - name: Run Current Overview canonical parity and query budget regression
        run: >-
          npx vitest run
          apps/api/src/energy/project-analysis-resolver.test.ts
          apps/api/src/energy/energy-analysis.test.ts
          --testNamePattern="pins the latest complete Project day|repeats the selected Ngee Ann golden period"

      - name: Run file and workspace regression
        run: node scripts/smoke-files.mjs

      - name: Run read-only SQL regression
        run: node scripts/smoke-sql-readonly.mjs

      - name: Run data gateway regression
        run: node scripts/smoke-data-gateway.mjs

      - name: Run AG-UI stream regression
        run: node scripts/smoke-agui-stream.mjs

      - name: Run evidence selection regression
        run: node scripts/test-evidence-selection.mjs

      - name: Run built-in DTC Growth regression
        run: node --test scripts/test-builtin-dtc-growth-datasource.mjs

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Check documentation links and secrets
        run: npm run smoke:docs

      - name: Build documentation in strict mode
        run: npm run docs:build

  dependency-audit:
    name: Dependency Audit (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # TODO(security): make this step blocking (drop the report-only branch below) once the high
      # and critical advisories in production dependencies are fixed. Until then it lists them in
      # the log, the job summary and a warning annotation without failing CI.
      - name: Audit production dependencies
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > audit.txt 2>&1
          status=$?
          set -e
          cat audit.txt
          if [ "$status" -ne 0 ]; then
            echo "::warning title=npm audit::Production dependencies have high or critical advisories (report-only for now; see the job log)."
            {
              echo "## npm audit (production dependencies, report-only)"
              echo
              grep -E '^[0-9]+ vulnerabilities' audit.txt || tail -n 3 audit.txt
              echo
              echo 'Run `npm audit --omit=dev` locally for the full list.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  secret-scan:
    name: Secret Scan (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from that release's checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      # TODO(security): make this blocking (--exit-code 1) once existing findings are triaged and
      # false positives are recorded in .gitleaksignore. Secret values are redacted from all output.
      - name: Scan git history for secrets
        run: |
          report="$RUNNER_TEMP/gitleaks.json"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 0 --report-format json --report-path "$report" .
          count=$(jq 'length' "$report")
          if [ "$count" -gt 0 ]; then
            echo "::warning title=gitleaks::${count} possible secret(s) found in git history (report-only; values redacted)."
            {
              echo "## gitleaks findings (report-only)"
              echo
              jq -r '.[:200][] | "- \(.RuleID): \(.File):\(.StartLine) (commit \(.Commit[0:12]))"' "$report"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
