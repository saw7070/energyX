<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 508" role="img" aria-label="Schematic floor plan of Tuya Singapore office, Level 27"
         style="width:100%;height:auto;display:block">
      <style>
        .svgt{font-family:'Archivo',system-ui,sans-serif}
        .zone-title{font-size:15px;font-weight:800;fill:#1C2530}
        .room{fill:#fff;stroke:#8A94A0;stroke-width:1.2}
        .rlabel{font-size:12px;fill:#1C2530}
        .rsub{font-size:10.5px;fill:#6B7480}
        .chip{font-size:11px;font-weight:600;fill:#fff}
        .dbbadge{fill:#1C2530}
        .dbtext{font-size:10.5px;font-weight:600;fill:#fff}
        .legend{font-size:11.5px;fill:#1C2530}
      </style>
      <!-- outer wall -->
      <rect x="20" y="16" width="820" height="404" fill="none" stroke="#1C2530" stroke-width="2.5"/>
      <!-- zones -->
      <rect x="24" y="20" width="366" height="396" fill="rgba(255,78,22,0.06)" stroke="#FF4E16" stroke-width="1.5"/>
      <rect x="470" y="20" width="366" height="396" fill="rgba(31,78,99,0.07)" stroke="#1F4E63" stroke-width="1.5"/>
      <text class="svgt zone-title" x="34" y="44">Zone B · DB2</text>
      <text class="svgt rsub" x="34" y="60">Current-period values calculated separately</text>
      <text class="svgt zone-title" x="654" y="44" text-anchor="start">Zone A · DB1</text>
      <text class="svgt rsub" x="654" y="60">Current-period values calculated separately</text>

      <!-- ===== Zone B rooms ===== -->
      <rect class="room" x="32" y="70" width="210" height="150"/>
      <text class="svgt rlabel" x="137" y="150" text-anchor="middle" font-weight="600">Show room</text>
      <!-- LED panels on showroom wall -->
      <rect x="46" y="80" width="56" height="11" fill="#F2A50C"/>
      <rect x="112" y="80" width="56" height="11" fill="#F2A50C"/>
      <rect x="178" y="80" width="56" height="11" fill="#F2A50C"/>
      <text class="svgt rlabel" x="46" y="106" font-weight="600">Zone C · 3× large LED panels (DB3)</text>
      <text class="svgt rsub" x="46" y="121">Reference layout only; operation to be checked</text>

      <rect class="room" x="250" y="70" width="132" height="70"/>
      <text class="svgt rlabel" x="316" y="108" text-anchor="middle">Pantry</text>

      <rect class="room" x="250" y="148" width="132" height="72"/>
      <text class="svgt rlabel" x="316" y="182" text-anchor="middle">Meeting Room 2</text>

      <rect class="room" x="32" y="304" width="108" height="100"/>
      <rect class="room" x="148" y="304" width="108" height="100"/>
      <rect class="room" x="264" y="304" width="108" height="100"/>
      <text class="svgt rlabel" x="86" y="350" text-anchor="middle">Small</text>
      <text class="svgt rlabel" x="86" y="366" text-anchor="middle">mtg 1</text>
      <text class="svgt rlabel" x="202" y="350" text-anchor="middle">Small</text>
      <text class="svgt rlabel" x="202" y="366" text-anchor="middle">mtg 2</text>
      <text class="svgt rlabel" x="318" y="350" text-anchor="middle">Small</text>
      <text class="svgt rlabel" x="318" y="366" text-anchor="middle">mtg 3</text>

      <rect class="dbbadge" x="32" y="238" width="46" height="20" rx="3"/>
      <text class="svgt dbtext" x="55" y="252" text-anchor="middle">DB3</text>
      <rect class="dbbadge" x="86" y="238" width="46" height="20" rx="3"/>
      <text class="svgt dbtext" x="109" y="252" text-anchor="middle">DB2</text>
      <text class="svgt rsub" x="140" y="252">lighting + load total</text>

      <!-- ===== Zone A rooms ===== -->
      <rect class="room" x="478" y="70" width="166" height="240"/>
      <text class="svgt rlabel" x="561" y="182" text-anchor="middle" font-weight="600">Open office</text>
      <text class="svgt rsub" x="561" y="198" text-anchor="middle">(right side)</text>

      <rect class="room" x="652" y="70" width="176" height="140"/>
      <text class="svgt rlabel" x="740" y="136" text-anchor="middle">Big meeting</text>
      <text class="svgt rlabel" x="740" y="152" text-anchor="middle">room</text>

      <rect class="room" x="652" y="218" width="176" height="92"/>
      <text class="svgt rlabel" x="740" y="260" text-anchor="middle">Director room</text>

      <rect class="dbbadge" x="478" y="330" width="46" height="20" rx="3"/>
      <text class="svgt dbtext" x="501" y="344" text-anchor="middle">DB1</text>
      <text class="svgt rsub" x="532" y="344">lighting + load total</text>

      <!-- ===== entrance & corridor ===== -->
      <rect x="390" y="20" width="80" height="396" fill="#fff"/>
      <line x1="390" y1="20" x2="390" y2="416" stroke="#E3E1DC"/>
      <line x1="470" y1="20" x2="470" y2="416" stroke="#E3E1DC"/>
      <!-- door gap -->
      <line x1="20" y1="420" x2="398" y2="420" stroke="#1C2530" stroke-width="2.5"/>
      <line x1="462" y1="420" x2="840" y2="420" stroke="#1C2530" stroke-width="2.5"/>
      <path d="M 462 420 A 64 64 0 0 0 398 356" fill="none" stroke="#9AA7B4" stroke-width="1" stroke-dasharray="3,3"/>
      <text class="svgt rlabel" x="430" y="444" text-anchor="middle" font-weight="600">Main entrance gate (DB1)</text>
      <!-- turn arrows -->
      <line x1="430" y1="400" x2="430" y2="300" stroke="#1C2530" stroke-width="1.6"/>
      <line x1="430" y1="300" x2="404" y2="300" stroke="#FF4E16" stroke-width="1.6"/>
      <path d="M 404 300 l 8 -5 v 10 z" fill="#FF4E16"/>
      <line x1="430" y1="300" x2="456" y2="300" stroke="#1F4E63" stroke-width="1.6"/>
      <path d="M 456 300 l -8 -5 v 10 z" fill="#1F4E63"/>
      <text class="svgt rsub" x="430" y="286" text-anchor="middle">turn left · Zones B + C</text>
      <text class="svgt rsub" x="430" y="326" text-anchor="middle">turn right · Zone A</text>

      <!-- legend -->
      <rect x="24" y="466" width="14" height="14" fill="rgba(255,78,22,0.15)" stroke="#FF4E16"/>
      <text class="svgt legend" x="44" y="477">Zone B (DB2)</text>
      <rect x="192" y="466" width="14" height="14" fill="rgba(31,78,99,0.15)" stroke="#1F4E63"/>
      <text class="svgt legend" x="212" y="477">Zone A (DB1)</text>
      <rect x="330" y="466" width="14" height="14" fill="#F2A50C"/>
      <text class="svgt legend" x="350" y="477">Zone C · LED panel (DB3)</text>
      <rect x="520" y="466" width="30" height="14" rx="3" fill="#1C2530"/>
      <text class="svgt legend" x="558" y="477">Distribution board</text>
      <text class="svgt rsub" x="836" y="477" text-anchor="end">Illustrative schematic — not to scale · Level 27 · ≈700 m²</text>
    </svg>
